name: Format firmware UI on development
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/format-dev-firmware.yml'
      - 'veci/js/lib/firmware-updates.js'
      - 'veci/js/pages/system.js'
      - 'veci/js/pages/apps.js'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '8.15.9'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write veci/js/lib/firmware-updates.js veci/js/pages/system.js veci/js/pages/apps.js
      - run: git diff --check
      - name: Commit formatting only
        run: |
          git add veci/js/lib/firmware-updates.js veci/js/pages/system.js veci/js/pages/apps.js
          if ! git diff --cached --quiet; then
            git -c user.name="veci-ci" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Format guarded VeCI firmware UI"
            git push origin HEAD:dev
          fi
