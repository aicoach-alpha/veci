name: VeCI format preview for pinned WE5927
on:
  pull_request:
    paths:
      - '.github/workflows/veci-format-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '8.15.9'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write veci/js/app.js veci/js/lib/menu-policy.js veci/js/pages/apps.js
      - name: Emit encoded formatted source for manual audited commit
        run: |
          for f in veci/js/app.js veci/js/lib/menu-policy.js veci/js/pages/apps.js; do
            echo "VECIFORMAT_BEGIN:$f"
            base64 "$f" | tr -d '\n' | fold -w 240
            echo "VECIFORMAT_END:$f"
          done
