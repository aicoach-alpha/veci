name: VeCI Quality

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec eslint veci demo scripts eslint.config.js --max-warnings=0
      - run: pnpm build
      - run: node scripts/build-demo.js

      - name: Verify demo artifact
        run: |
          test -f dist/demo-site/index.html
          test -f dist/demo-site/js/lib/api.js
          grep -q 'VeCI Interactive Demo' dist/demo-site/index.html

      - name: Verify VeCI source boundary
        run: |
          test -f veci/js/app.js
          test -d veci/js/pages
          test ! -e veci/js/core.js
          test ! -d veci/js/modules
          test ! -d examples

      - name: Verify VeCI active source is independent
        run: |
          if grep -Rni -E 'MoCI|moci' veci files scripts Makefile rpcd-acl.json package.json; then
            echo "MoCI-era identifiers are not allowed in active VeCI source. Attribution belongs in NOTICE/docs only."
            exit 1
          fi
          test "$(wc -c < veci/icons/veci.svg)" -gt 200
          grep -q '<svg' veci/icons/veci.svg

      - name: Verify no router-model hardcoding
        run: |
          if grep -Rni -E 'ZBT-WE5927|WE5927-OpenWrt|WE2825-2SIM' veci; then
            echo "Generic VeCI core must discover hardware at runtime."
            exit 1
          fi

      - name: Verify no administrator password persistence
        run: |
          if grep -Rni -E 'saved_credentials|localStorage.*(password|credential)' veci; then
            echo "Password persistence pattern found."
            exit 1
          fi

      - name: Check RPC helper syntax
        run: sh -n files/rpcd-veci

      - name: Bundle size
        run: |
          du -sh dist/veci
          find dist/veci -type f -printf '%s\n' | awk '{ total += $1 } END { print "bundle_bytes=" total }'
