name: VeCI Quality

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm exec eslint veci demo scripts eslint.config.js --max-warnings=0
      - run: pnpm test:quota
      - run: pnpm test:modem
      - run: node scripts/test-cellular-sms-storage.js
      - name: Emit pinned minified Cellular asset fingerprints for router compatibility audit
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { minify } from 'terser';
          const sources = [
            ['BASE', 'f19603b6172854dfeca3861826017d8f1aa1268c', 'veci/js/pages/cellular.js'],
            ['UPDATED', '88009f1fd394eeeb583f27839d29c714e31b91b6', 'veci/js/pages/cellular.js'],
            ['FORMATTER', '88009f1fd394eeeb583f27839d29c714e31b91b6', 'veci/js/lib/messaging.js']
          ];
          for (const [label, commit, path] of sources) {
            const input = execFileSync('git', ['show', commit + ':' + path], { encoding: 'utf8' });
            const output = await minify(input, {
              module: true,
              compress: { dead_code: true, drop_debugger: true, passes: 2 },
              mangle: { toplevel: true },
              format: { comments: false }
            });
            if (!output.code) throw new Error(label + ' empty Terser output');
            const b = Buffer.from(output.code);
            const sha = createHash('sha256').update(b).digest('hex');
            console.log('VECI_ASSET_' + label + '_SHA256=' + sha);
            console.log('VECI_ASSET_' + label + '_BYTES=' + b.length);
            console.log('VECI_ASSET_' + label + '_BASE64=' + b.toString('base64'));
          }
          JS
      - run: pnpm build
      - run: node scripts/build-demo.js

      - name: Verify demo artifact
        run: |
          test -f dist/demo-site/index.html
          test -f dist/demo-site/js/lib/api.js
          grep -q 'VeCI Interactive Demo' dist/demo-site/index.html


      - name: Verify router-root asset base
        run: |
          grep -q '<base href="/veci/" />' dist/veci/index.html
          grep -q '<base href="./" />' dist/demo-site/index.html

      - name: Verify VeCI source boundary
        run: |
          test -f veci/js/app.js
          test -d veci/js/pages
          test ! -e veci/js/core.js
          test ! -d veci/js/modules
          test ! -d examples

      - name: Verify VeCI active source is independent
        run: |
          if grep -Rni -E 'MoCI|moci' veci files scripts Makefile rpcd-acl.json package.json; then
            echo "MoCI-era identifiers are not allowed in active VeCI source. Attribution belongs in NOTICE/docs only."
            exit 1
          fi
          test "$(wc -c < veci/icons/veci.svg)" -gt 200
          grep -q '<svg' veci/icons/veci.svg

      - name: Verify no router-model hardcoding
        run: |
          if grep -Rni -E 'ZBT-WE5927|WE5927-OpenWrt|WE2825-2SIM' veci; then
            echo "Generic VeCI core must discover hardware at runtime."
            exit 1
          fi

      - name: Verify no administrator password persistence
        run: |
          if grep -Rni -E 'saved_credentials|localStorage.*(password|credential)' veci; then
            echo "Password persistence pattern found."
            exit 1
          fi

      - name: Check RPC helper syntax
        run: sh -n files/rpcd-veci

      - name: Bundle size
        run: |
          du -sh dist/veci
          find dist/veci -type f -printf '%s\n' | awk '{ total += $1 } END { print "bundle_bytes=" total }'
